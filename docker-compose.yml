# ============================================================
# docker-compose.yml：文旅问答服务（基础编排，CPU 兼容）
# ============================================================
# GPU 部署（生产环境）：
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# 无 GPU 环境（仅构建验证 / CPU 推理）：
#   docker compose up -d
#
# 本文件刻意不声明 GPU 设备，这样在未安装 NVIDIA Container Toolkit
# 的机器上也能启动（不会报 "could not select device driver"）。
# ============================================================

services:
  tourism-llm:
    build:
      context: .
      dockerfile: Dockerfile
    image: tourism-llm:latest
    container_name: tourism-llm

    # 端口映射
    ports:
      - "8000:8000"

    # 环境变量（覆盖 Dockerfile 默认值）
    environment:
      - BASE_MODEL_PATH=${BASE_MODEL_PATH:-/models/Qwen2-7B-Instruct}
      - LORA_PATH=/app/outputs/qwen-tourism-lora
      - HOST=0.0.0.0
      - PORT=8000

    # 模型目录挂载（基座模型在宿主机，不打入镜像）
    volumes:
      # 基座模型目录（按实际路径修改）
      - ${MODEL_HOST_PATH:-/models/Qwen2-7B-Instruct}:/models/Qwen2-7B-Instruct:ro
      # LoRA 权重（训练产物）
      - ./outputs/qwen-tourism-lora:/app/outputs/qwen-tourism-lora:ro

    # 重启策略
    restart: unless-stopped

    # 日志限制
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
